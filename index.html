<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>La Chasse au Trésor de Paris</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Lora,Georgia,serif;background:#fbf6ec;color:#1f2a4a;-webkit-tap-highlight-color:transparent}
#app{display:flex;min-height:100%}
.rib{position:fixed;left:0;top:0;bottom:0;width:86px;background:#1f2a4a;display:flex;flex-direction:column;padding:8px 6px;gap:6px;overflow-y:auto;z-index:5;border-right:4px solid #c9a24a}
.rib .logo{color:#c9a24a;text-align:center;font-size:11px;letter-spacing:1px;padding:4px 0 6px;border-bottom:1px solid #3a466a}
.tab{position:relative;border:0;background:#2b3760;border-radius:12px;padding:6px 4px 5px;color:#fbf6ec;font:inherit;font-size:10.5px;line-height:1.15;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.tab svg{width:48px;height:48px;background:#fffdf8;border-radius:50%;padding:4px}
.tab.on{background:#c8323c}
.tab .ok{position:absolute;top:2px;right:4px;background:#5d9a52;color:#fff;border-radius:50%;width:18px;height:18px;font-size:12px;line-height:18px;font-family:sans-serif}
.gear{margin-top:auto;border:0;background:none;color:#8a96b8;font:inherit;font-size:11px;padding:8px 0;cursor:pointer}
main{margin-left:86px;flex:1;min-width:0;overflow-x:hidden;padding:18px 16px 40px;max-width:640px}
.art{width:min(70vw,300px);height:min(70vw,300px);margin:6px auto 10px;background:#fffdf8;border-radius:50%;border:5px solid #c9a24a;box-shadow:0 0 0 7px #fbf6ec,0 0 0 10px #1f2a4a;display:flex;align-items:center;justify-content:center}
.art svg{width:76%;height:76%}
h1{text-align:center;font-size:24px;margin:16px 0 2px;line-height:1.2}
.sub{text-align:center;font-style:italic;color:#c8323c;margin:0 0 16px}
form{display:flex;gap:8px;max-width:420px;margin:0 auto}
input.pw{flex:1;min-width:0;font:inherit;font-size:20px;padding:12px 8px;border:3px solid #1f2a4a;border-radius:12px;background:#fff;text-transform:uppercase;letter-spacing:1px;text-align:center}input.pw::placeholder{font-size:15px;letter-spacing:0}
.btn{font:inherit;font-weight:700;font-size:18px;border:0;border-radius:12px;padding:12px 18px;background:#c8323c;color:#fff;cursor:pointer}
.btn.alt{background:#1f2a4a}.btn.ghost{background:#e9dfcb;color:#1f2a4a}
.msg{text-align:center;min-height:28px;margin-top:10px;font-style:italic;color:#c8323c;font-size:17px}
.shake{animation:sh .4s}@keyframes sh{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.reveal{background:#fff;border:3px solid #c9a24a;border-radius:18px;padding:16px;text-align:center;margin-top:6px;animation:pop .5s}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.reveal h2{margin:0;color:#5d9a52;font-size:28px}.reveal p{margin:6px 0 12px;font-size:18px}
.reveal img{width:100%;border-radius:12px;display:block;margin-bottom:10px}
.room{font-size:30px;font-weight:700;color:#c8323c;margin:6px 0 14px}
.conf{position:fixed;top:-20px;width:10px;height:14px;z-index:9;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.setup h1{text-align:left}.card{background:#fff;border:2px solid #e3d6b8;border-radius:14px;padding:12px;margin:12px 0}
.card h3{margin:0 0 8px;display:flex;align-items:center;gap:8px}.card h3 svg{width:34px;height:34px}
label{display:block;font-size:13px;color:#666;margin:8px 0 3px}
.card input[type=text]{width:100%;font:inherit;font-size:17px;padding:9px;border:2px solid #ccc;border-radius:9px}
.thumb{max-width:100%;max-height:160px;border-radius:8px;display:block;margin:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{font-size:14px;color:#555;font-style:italic}
.dlg{position:fixed;inset:0;background:rgba(20,25,45,.6);display:flex;align-items:center;justify-content:center;z-index:20}
.dlg>div{background:#fbf6ec;border-radius:16px;padding:20px;width:min(90vw,340px);text-align:center}
</style></head><body><div id="app"></div>
<script>
const CFG = /*CFG*/{"pin": "1234", "realms": {"A": {"pwd": "BONJOUR", "room": "La cuisine", "photo": null}, "E": {"pwd": "MERCI", "room": "Le salon", "photo": null}, "L": {"pwd": "TRESOR", "room": "La salle de bain", "photo": null}, "N": {"pwd": "CHOCOLAT", "room": "La chambre", "photo": null}, "S": {"pwd": "PARIS", "room": "L'entrée", "photo": null}}}/*END*/;
const ART = {"A": "<rect x=\"28\" y=\"40\" width=\"144\" height=\"16\" fill=\"#1f2a4a\"/>\n<rect x=\"34\" y=\"56\" width=\"132\" height=\"10\" fill=\"#c9a24a\"/>\n<rect x=\"40\" y=\"66\" width=\"120\" height=\"114\" fill=\"#efe3cc\" stroke=\"#1f2a4a\" stroke-width=\"3\"/>\n<line x1=\"40\" y1=\"88\" x2=\"160\" y2=\"88\" stroke=\"#1f2a4a\" stroke-width=\"2\"/>\n<path d=\"M78 180 V124 A22 22 0 0 1 122 124 V180 Z\" fill=\"#1f2a4a\"/>\n<rect x=\"48\" y=\"104\" width=\"20\" height=\"44\" fill=\"none\" stroke=\"#1f2a4a\" stroke-width=\"2\"/>\n<rect x=\"132\" y=\"104\" width=\"20\" height=\"44\" fill=\"none\" stroke=\"#1f2a4a\" stroke-width=\"2\"/>\n<path d=\"M90 70 h20 v14 h-20z\" fill=\"#c8323c\"/>\n<rect x=\"22\" y=\"180\" width=\"156\" height=\"7\" fill=\"#1f2a4a\"/>", "E": "<path d=\"M100 12 L104 40 L112 88 L122 118 L152 184 L126 184 Q100 146 74 184 L48 184 L78 118 L88 88 L96 40 Z\" fill=\"#1f2a4a\"/>\n<g stroke=\"#8fa3c8\" stroke-width=\"1.3\" opacity=\".9\">\n<path d=\"M98 45 L104 60 L96 75 L106 88\"/><path d=\"M90 96 L112 116 M110 96 L88 116\"/>\n<path d=\"M80 128 L122 170 M120 128 L78 170\"/></g>\n<rect x=\"80\" y=\"86\" width=\"40\" height=\"6\" fill=\"#c9a24a\"/>\n<rect x=\"68\" y=\"116\" width=\"64\" height=\"7\" fill=\"#c9a24a\"/>\n<circle cx=\"100\" cy=\"12\" r=\"3\" fill=\"#c8323c\"/>", "L": "<defs><clipPath id=\"tri\"><polygon points=\"30,170 100,50 170,170\"/></clipPath></defs>\n<polygon points=\"30,170 100,50 170,170\" fill=\"#a9c7dd\"/>\n<g clip-path=\"url(#tri)\" stroke=\"#ffffff\" stroke-width=\"1.6\" opacity=\".9\"><line x1=\"-146\" y1=\"170\" x2=\"-6\" y2=\"-70\"/><line x1=\"-146\" y1=\"170\" x2=\"-286\" y2=\"-70\"/><line x1=\"-124\" y1=\"170\" x2=\"16\" y2=\"-70\"/><line x1=\"-124\" y1=\"170\" x2=\"-264\" y2=\"-70\"/><line x1=\"-102\" y1=\"170\" x2=\"38\" y2=\"-70\"/><line x1=\"-102\" y1=\"170\" x2=\"-242\" y2=\"-70\"/><line x1=\"-80\" y1=\"170\" x2=\"60\" y2=\"-70\"/><line x1=\"-80\" y1=\"170\" x2=\"-220\" y2=\"-70\"/><line x1=\"-58\" y1=\"170\" x2=\"82\" y2=\"-70\"/><line x1=\"-58\" y1=\"170\" x2=\"-198\" y2=\"-70\"/><line x1=\"-36\" y1=\"170\" x2=\"104\" y2=\"-70\"/><line x1=\"-36\" y1=\"170\" x2=\"-176\" y2=\"-70\"/><line x1=\"-14\" y1=\"170\" x2=\"126\" y2=\"-70\"/><line x1=\"-14\" y1=\"170\" x2=\"-154\" y2=\"-70\"/><line x1=\"8\" y1=\"170\" x2=\"148\" y2=\"-70\"/><line x1=\"8\" y1=\"170\" x2=\"-132\" y2=\"-70\"/><line x1=\"30\" y1=\"170\" x2=\"170\" y2=\"-70\"/><line x1=\"30\" y1=\"170\" x2=\"-110\" y2=\"-70\"/><line x1=\"52\" y1=\"170\" x2=\"192\" y2=\"-70\"/><line x1=\"52\" y1=\"170\" x2=\"-88\" y2=\"-70\"/><line x1=\"74\" y1=\"170\" x2=\"214\" y2=\"-70\"/><line x1=\"74\" y1=\"170\" x2=\"-66\" y2=\"-70\"/><line x1=\"96\" y1=\"170\" x2=\"236\" y2=\"-70\"/><line x1=\"96\" y1=\"170\" x2=\"-44\" y2=\"-70\"/><line x1=\"118\" y1=\"170\" x2=\"258\" y2=\"-70\"/><line x1=\"118\" y1=\"170\" x2=\"-22\" y2=\"-70\"/><line x1=\"140\" y1=\"170\" x2=\"280\" y2=\"-70\"/><line x1=\"140\" y1=\"170\" x2=\"0\" y2=\"-70\"/><line x1=\"162\" y1=\"170\" x2=\"302\" y2=\"-70\"/><line x1=\"162\" y1=\"170\" x2=\"22\" y2=\"-70\"/><line x1=\"184\" y1=\"170\" x2=\"324\" y2=\"-70\"/><line x1=\"184\" y1=\"170\" x2=\"44\" y2=\"-70\"/><line x1=\"206\" y1=\"170\" x2=\"346\" y2=\"-70\"/><line x1=\"206\" y1=\"170\" x2=\"66\" y2=\"-70\"/><line x1=\"228\" y1=\"170\" x2=\"368\" y2=\"-70\"/><line x1=\"228\" y1=\"170\" x2=\"88\" y2=\"-70\"/><line x1=\"250\" y1=\"170\" x2=\"390\" y2=\"-70\"/><line x1=\"250\" y1=\"170\" x2=\"110\" y2=\"-70\"/><line x1=\"272\" y1=\"170\" x2=\"412\" y2=\"-70\"/><line x1=\"272\" y1=\"170\" x2=\"132\" y2=\"-70\"/><line x1=\"0\" y1=\"80\" x2=\"200\" y2=\"80\"/><line x1=\"0\" y1=\"102\" x2=\"200\" y2=\"102\"/><line x1=\"0\" y1=\"124\" x2=\"200\" y2=\"124\"/><line x1=\"0\" y1=\"146\" x2=\"200\" y2=\"146\"/><line x1=\"0\" y1=\"168\" x2=\"200\" y2=\"168\"/></g>\n<polygon points=\"30,170 100,50 170,170\" fill=\"none\" stroke=\"#1f2a4a\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<rect x=\"12\" y=\"170\" width=\"176\" height=\"7\" fill=\"#1f2a4a\"/>\n<rect x=\"6\" y=\"160\" width=\"20\" height=\"10\" fill=\"#a9c7dd\" stroke=\"#1f2a4a\" stroke-width=\"2\"/>\n<rect x=\"174\" y=\"160\" width=\"20\" height=\"10\" fill=\"#a9c7dd\" stroke=\"#1f2a4a\" stroke-width=\"2\"/>", "N": "<path d=\"M100 18 L105 62 L95 62Z\" fill=\"#1f2a4a\"/>\n<g fill=\"#e6d8b8\" stroke=\"#1f2a4a\" stroke-width=\"2.5\">\n<rect x=\"82\" y=\"60\" width=\"36\" height=\"120\"/><rect x=\"36\" y=\"40\" width=\"46\" height=\"140\"/><rect x=\"118\" y=\"40\" width=\"46\" height=\"140\"/></g>\n<g fill=\"#1f2a4a\">\n<path d=\"M44 92 V58 a6 6 0 0 1 12 0 V92Z\"/><path d=\"M62 92 V58 a6 6 0 0 1 12 0 V92Z\"/>\n<path d=\"M126 92 V58 a6 6 0 0 1 12 0 V92Z\"/><path d=\"M144 92 V58 a6 6 0 0 1 12 0 V92Z\"/>\n<path d=\"M48 180 V158 a11 11 0 0 1 22 0 V180Z\"/><path d=\"M130 180 V158 a11 11 0 0 1 22 0 V180Z\"/>\n<path d=\"M87 180 V154 a13 13 0 0 1 26 0 V180Z\"/></g>\n<rect x=\"36\" y=\"130\" width=\"128\" height=\"7\" fill=\"#c9a24a\" stroke=\"#1f2a4a\" stroke-width=\"1.5\"/>\n<circle cx=\"100\" cy=\"100\" r=\"16\" fill=\"#5878b8\" stroke=\"#1f2a4a\" stroke-width=\"2.5\"/>\n<g stroke=\"#1f2a4a\" stroke-width=\"1.5\"><line x1=\"84\" y1=\"100\" x2=\"116\" y2=\"100\"/><line x1=\"100\" y1=\"84\" x2=\"100\" y2=\"116\"/>\n<line x1=\"89\" y1=\"89\" x2=\"111\" y2=\"111\"/><line x1=\"111\" y1=\"89\" x2=\"89\" y2=\"111\"/></g>\n<rect x=\"32\" y=\"36\" width=\"54\" height=\"6\" fill=\"#1f2a4a\"/><rect x=\"114\" y=\"36\" width=\"54\" height=\"6\" fill=\"#1f2a4a\"/>", "S": "<g fill=\"#f6f2ea\" stroke=\"#1f2a4a\" stroke-width=\"2.5\" stroke-linejoin=\"round\">\n<rect x=\"150\" y=\"50\" width=\"18\" height=\"80\"/><path d=\"M148 50 Q159 26 170 50Z\"/>\n<rect x=\"36\" y=\"120\" width=\"128\" height=\"60\"/>\n<rect x=\"48\" y=\"100\" width=\"24\" height=\"20\"/><path d=\"M46 100 Q60 70 74 100Z\"/>\n<rect x=\"128\" y=\"100\" width=\"24\" height=\"20\"/><path d=\"M126 100 Q140 70 154 100Z\"/>\n<rect x=\"76\" y=\"80\" width=\"48\" height=\"40\"/><path d=\"M70 82 Q70 34 100 28 Q130 34 130 82Z\"/>\n<rect x=\"95\" y=\"16\" width=\"10\" height=\"13\"/></g>\n<g stroke=\"#1f2a4a\" stroke-width=\"2\"><line x1=\"100\" y1=\"4\" x2=\"100\" y2=\"16\"/><line x1=\"96\" y1=\"8\" x2=\"104\" y2=\"8\"/>\n<line x1=\"60\" y1=\"64\" x2=\"60\" y2=\"74\"/><line x1=\"140\" y1=\"64\" x2=\"140\" y2=\"74\"/><line x1=\"159\" y1=\"20\" x2=\"159\" y2=\"28\"/></g>\n<g fill=\"#1f2a4a\"><rect x=\"84\" y=\"88\" width=\"5\" height=\"22\" rx=\"2.5\"/><rect x=\"97\" y=\"88\" width=\"5\" height=\"22\" rx=\"2.5\"/><rect x=\"110\" y=\"88\" width=\"5\" height=\"22\" rx=\"2.5\"/>\n<path d=\"M58 180 V160 a8 8 0 0 1 16 0 V180Z\"/><path d=\"M90 180 V154 a10 10 0 0 1 20 0 V180Z\"/><path d=\"M126 180 V160 a8 8 0 0 1 16 0 V180Z\"/></g>\n<g stroke=\"#1f2a4a\" stroke-width=\"2\"><line x1=\"24\" y1=\"184\" x2=\"176\" y2=\"184\"/><line x1=\"16\" y1=\"190\" x2=\"184\" y2=\"190\"/></g>"};
const META = [
 {k:"A",name:"Arc de Triomphe",of:"de l'Arc de Triomphe",short:"Arc"},{k:"E",name:"Tour Eiffel",of:"de la Tour Eiffel",short:"Eiffel"},
 {k:"L",name:"Louvre",of:"du Louvre",short:"Louvre"},{k:"N",name:"Notre-Dame",of:"de Notre-Dame",short:"Notre-Dame"},{k:"S",name:"Sacré-Cœur",of:"du Sacré-Cœur",short:"Sacré-Cœur"}];
let cur = 0, view = "realm", solved = {};
try { solved = JSON.parse(localStorage.getItem("pth-solved") || "{}"); } catch(e) {}
let draft = null;
try { const s = JSON.parse(localStorage.getItem("pth-cfg")||"null"); if (s && s.realms) Object.assign(CFG, s); } catch(e) {}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/gi,"").toUpperCase();
const svg = (k, cls="") => `<svg viewBox="0 0 200 200" class="${cls}">${ART[k]}</svg>`;
function saveSolved(){ try { localStorage.setItem("pth-solved", JSON.stringify(solved)); } catch(e) {} }

function render(){
  const tabs = META.map((m,i)=>`<button class="tab ${view==="realm"&&i===cur?"on":""}" data-i="${i}">${svg(m.k)}${esc(m.short)}${solved[m.k]?'<span class="ok">✓</span>':""}</button>`).join("");
  $("#app").innerHTML = `<nav class="rib"><div class="logo">✦ PARIS ✦</div>${tabs}<button class="gear" id="gear">⚙ Parent</button></nav><main id="main"></main>`;
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;view="realm";render();window.scrollTo(0,0);});
  $("#gear").onclick = askPin;
  view==="setup" ? renderSetup() : renderRealm();
}

function renderRealm(){
  const m = META[cur], r = CFG.realms[m.k];
  $("#main").innerHTML = `<div class="art">${svg(m.k)}</div>
   <h1>Le Royaume ${m.of}</h1>
   <p class="sub">${solved[m.k]?"Royaume débloqué !":"Entre le mot de passe secret"}</p>
   <div id="zone"></div>`;
  solved[m.k] ? showReveal(false) : showForm();
}
function showForm(){
  $("#zone").innerHTML = `<form id="f"><input class="pw" id="pw" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="characters" placeholder="MOT DE PASSE"><button class="btn">Entrer</button></form><div class="msg" id="msg"></div>`;
  $("#f").onsubmit = e => { e.preventDefault(); const k = META[cur].k;
    if (norm($("#pw").value) && norm($("#pw").value) === norm(CFG.realms[k].pwd)) { solved[k]=true; saveSolved(); render(); confetti(); }
    else { const f=$("#f"); f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake"); $("#msg").textContent="Oups ! Ce n'est pas le bon mot de passe. Essaie encore !"; $("#pw").select(); } };
}
function showReveal(){
  const k = META[cur].k, r = CFG.realms[k];
  const next = META.findIndex(m=>!solved[m.k]);
  $("#zone").innerHTML = `<div class="reveal"><h2>Bravo !</h2><p>Le trésor est caché dans :</p>
   ${r.photo?`<img src="${r.photo}" alt="">`:""}<div class="room">${esc(r.room)}</div>
   ${next>=0?`<button class="btn alt" id="nx">Royaume suivant →</button>`:`<p><b>Tu as trouvé tous les trésors ! Félicitations !</b></p>`}</div>`;
  if (next>=0) $("#nx").onclick=()=>{cur=next;render();window.scrollTo(0,0);};
}
function confetti(){ const cols=["#c8323c","#2a4fa0","#c9a24a","#5d9a52","#f2a7b8","#fff"];
  for(let i=0;i<70;i++){const d=document.createElement("div");d.className="conf";d.style.left=Math.random()*100+"vw";d.style.background=cols[i%cols.length];d.style.animationDuration=(1.8+Math.random()*1.8)+"s";d.style.animationDelay=Math.random()*.5+"s";document.body.appendChild(d);setTimeout(()=>d.remove(),4500);} }

function askPin(){
  const d=document.createElement("div"); d.className="dlg";
  d.innerHTML=`<div><h3 style="margin-top:0">Parents only</h3><p class="note">Enter the parent PIN</p><input class="pw" id="pin" inputmode="numeric" type="password" style="width:100%"><div class="msg" id="pm"></div><div class="row" style="justify-content:center"><button class="btn ghost" id="pc">Cancel</button><button class="btn" id="po">Open</button></div></div>`;
  document.body.appendChild(d); $("#pin").focus();
  $("#pc").onclick=()=>d.remove();
  const go=()=>{ if($("#pin").value===String(CFG.pin)){d.remove();draft=JSON.parse(JSON.stringify(CFG));view="setup";render();window.scrollTo(0,0);} else $("#pm").textContent="Wrong PIN"; };
  $("#po").onclick=go; $("#pin").onkeydown=e=>{if(e.key==="Enter")go();};
}

function renderSetup(){
  const cards = META.map(m=>{const r=draft.realms[m.k]; return `<div class="card"><h3>${svg(m.k)}${esc(m.name)}</h3>
    <label>Password the kids must enter</label><input type="text" data-k="${m.k}" data-f="pwd" value="${esc(r.pwd)}">
    <label>Where the treasure is (room / spot)</label><input type="text" data-k="${m.k}" data-f="room" value="${esc(r.room)}">
    <label>Photo of the hiding spot (optional)</label>${r.photo?`<img class="thumb" src="${r.photo}">`:""}
    <div class="row"><label class="btn ghost" style="font-size:15px;margin:0">${r.photo?"Change photo":"Add photo"}<input type="file" accept="image/*" data-k="${m.k}" hidden></label>${r.photo?`<button class="btn ghost" style="font-size:15px" data-rm="${m.k}">Remove</button>`:""}</div></div>`}).join("");
  $("#main").innerHTML = `<div class="setup"><h1>Parent setup</h1>
   <p class="note">Passwords ignore capitals, spaces and accents (so "Notre Dame" = NOTREDAME). Settings and photos are saved on this phone only, so set it up on the phone the kids will use.</p>${cards}
   <div class="card"><label>Parent PIN</label><input type="text" id="newpin" inputmode="numeric" value="${esc(draft.pin)}"></div>
   <div class="row"><button class="btn" id="sv">Save</button><button class="btn ghost" id="cx">Cancel</button><button class="btn ghost" id="rs">Reset kids' progress</button></div>
   <div class="msg" id="sm"></div></div>`;
  document.querySelectorAll(".card input[type=text][data-k]").forEach(i=>i.oninput=()=>{draft.realms[i.dataset.k][i.dataset.f]=i.value;});
  $("#newpin").oninput=e=>{draft.pin=e.target.value.trim()||"1234";};
  document.querySelectorAll("input[type=file]").forEach(i=>i.onchange=async()=>{ if(!i.files[0])return; $("#sm").textContent="Preparing photo…"; draft.realms[i.dataset.k].photo=await shrink(i.files[0]); renderSetup(); });
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{draft.realms[b.dataset.rm].photo=null;renderSetup();});
  $("#cx").onclick=()=>{view="realm";render();};
  $("#rs").onclick=()=>{solved={};saveSolved();$("#sm").textContent="Progress reset — all realms are locked again on this phone.";};
  $("#sv").onclick=save;
}
function shrink(file){ return new Promise(res=>{ const url=URL.createObjectURL(file), img=new Image();
  img.onload=()=>{ const s=Math.min(1,800/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg",0.6)); };
  img.onerror=()=>res(null); img.src=url; }); }
function save(){
  const sm=$("#sm");
  try { localStorage.setItem("pth-cfg", JSON.stringify(draft)); Object.assign(CFG, JSON.parse(JSON.stringify(draft))); sm.textContent="Saved on this phone!"; setTimeout(()=>{view="realm";render();},900); }
  catch(e){ sm.textContent="Could not save: the photos may be too big. Try removing one, or use smaller photos."; }
}
render();
</script></body></html>
